server:
  listen_addr: ":8080"
  read_timeout: 30s
  write_timeout: 10m
  shutdown_timeout: 10s
  public_base_url: "http://localhost:8080"

upstream:
  request_timeout: 9m # includes queueing, retries, redirects, and the complete response body
  response_header_timeout: 30s
  max_concurrent_per_registry: 4
  queue_timeout: 15s
  rate_limit_retries: 1
  max_retry_after: 30s

auth:
  bearer_token_env: ""
  basic_username_env: ""
  basic_password_env: ""

cache:
  backend: none # none, filesystem, or s3
  artifact_ttl: 24h
  max_object_size: 536870912 # 512 MiB
  temp_directory: "" # defaults to the operating system temp directory
  read_timeout: 30s
  store_timeout: 10m
  filesystem:
    directory: /var/cache/package-firewall
  s3:
    bucket: ""
    prefix: package-firewall
    expected_bucket_owner: ""

coordination:
  backend: none # none or dynamodb; use dynamodb with a shared S3 cache across replicas
  lease_duration: 30s
  poll_interval: 1s
  dynamodb:
    table: ""
    key_prefix: package-firewall

decision:
  fail_open_intel_errors: true
  fail_open_unknown_package: true
  vulnerability_block_threshold: 9.0
  default_vulnerability_action: warn

intel:
  osv:
    enabled: true
    api_url: "https://api.osv.dev/v1/query"
    timeout: 8s
    cache_ttl: 6h

policy:
  files:
    - "policy.example.yml"

routes:
  - name: npm
    ecosystem: npm
    path_prefix: /npm/
    upstream_url: https://registry.npmjs.org/
    # Cross-origin redirects are observed in origin-only logs by default.
    # enforce_redirect_origins: true
    # allowed_redirect_origins:
    #   - https://cdn.example.com
  - name: pypi
    ecosystem: pypi
    path_prefix: /pypi/
    upstream_url: https://pypi.org/
    file_upstream_url: https://files.pythonhosted.org/
  - name: maven
    ecosystem: maven
    path_prefix: /maven/
    upstream_url: https://repo1.maven.org/maven2/
  - name: go
    ecosystem: go
    path_prefix: /go/
    upstream_url: https://proxy.golang.org/
