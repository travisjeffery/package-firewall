server:
  listen_addr: ":8080"
  read_timeout: 30s
  write_timeout: 10m
  shutdown_timeout: 10s
  public_base_url: "http://localhost:8080"

auth:
  bearer_token_env: ""
  basic_username_env: ""
  basic_password_env: ""

cache:
  backend: none # none, filesystem, or s3
  artifact_ttl: 24h
  max_object_size: 536870912 # 512 MiB
  temp_directory: "" # defaults to the operating system temp directory
  read_timeout: 30s
  store_timeout: 10m
  filesystem:
    directory: /var/cache/package-firewall
  s3:
    bucket: ""
    prefix: package-firewall
    expected_bucket_owner: ""

decision:
  fail_open_intel_errors: true
  fail_open_unknown_package: true
  vulnerability_block_threshold: 9.0
  default_vulnerability_action: warn

intel:
  osv:
    enabled: true
    api_url: "https://api.osv.dev/v1/query"
    timeout: 8s
    cache_ttl: 6h

policy:
  files:
    - "policy.example.yml"

routes:
  - name: npm
    ecosystem: npm
    path_prefix: /npm/
    upstream_url: https://registry.npmjs.org/
  - name: pypi
    ecosystem: pypi
    path_prefix: /pypi/
    upstream_url: https://pypi.org/
    file_upstream_url: https://files.pythonhosted.org/
  - name: maven
    ecosystem: maven
    path_prefix: /maven/
    upstream_url: https://repo1.maven.org/maven2/
  - name: go
    ecosystem: go
    path_prefix: /go/
    upstream_url: https://proxy.golang.org/
